# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-operator
spec:
  path: infrastructure/base/litellm/operator
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace litellm-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      NAME: litellm
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-config
spec:
  path: infrastructure/base/litellm/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace litellm-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: litellm-operator
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      NAME: litellm
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
