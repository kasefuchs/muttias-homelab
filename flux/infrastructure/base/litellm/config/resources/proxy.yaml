apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  applyMode: api
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  litellmSettings:
    json_logs: true
    drop_params: true
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly
      port: 6379
  routerSettings:
    redis_host: litellm-dragonfly
    redis_port: 6379
  route:
    hostnames:
      - llm.${CLUSTER_DOMAIN}
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: ListenerSet
        name: internal
        namespace: gateway-system
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          key: uri
          name: litellm-db-app
  envFrom:
    - secretRef:
        name: litellm-secret
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 24
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 30
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
