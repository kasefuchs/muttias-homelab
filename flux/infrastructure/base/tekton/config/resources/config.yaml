apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: all
  targetNamespace: tekton-system
  chain:
    disabled: true
  pruner:
    disabled: true
  result:
    disabled: true
  trigger:
    disabled: true
  pipeline:
    disable-creds-init: true
    set-security-context: true
  dashboard:
    readonly: false
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: true
        settings:
          tekton-dashboard-url: https://tekton.${CLUSTER_DOMAIN}
  tektonpruner:
    disabled: false
    global-config:
      enforcedConfigLevel: global
      ttlSecondsAfterFinished: 3600
      historyLimit: 10
      successfulHistoryLimit: 5
      failedHistoryLimit: 2
