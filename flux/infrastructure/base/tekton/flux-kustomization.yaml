# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-operator
spec:
  path: infrastructure/base/tekton/operator
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace tekton-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  postBuild:
    substitute:
      NAME: victoria-metrics
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-config
spec:
  path: infrastructure/base/tekton/config
  wait: true
  prune: true
  timeout: 10m
  interval: 1h
  retryInterval: 2m
  targetNamespace: &namespace tekton-system
  sourceRef:
    kind: OCIRepository
    name: flux-system
  dependsOn:
    - name: tekton-operator
  postBuild:
    substitute:
      NAME: victoria-metrics
      NAMESPACE: *namespace
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
