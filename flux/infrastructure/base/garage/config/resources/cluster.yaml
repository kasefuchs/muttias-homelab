apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
spec:
  storage:
    env:
      # i guess there should be a better way
      - name: GARAGE_ALLOW_WORLD_READABLE_SECRETS
        value: "true"
    securityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 999
      fsGroup: 999
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  admin:
    adminTokenSecretRef:
      name: garage-secret
      key: admin-token
  network:
    rpcSecretRef:
      name: garage-secret
      key: rpc-secret
  webApi:
    rootDomain: .web.garage.${CLUSTER_DOMAIN}
  logging:
    level: warn
