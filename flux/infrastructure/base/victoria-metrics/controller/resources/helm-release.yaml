apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  releaseName: victoria-metrics-k8s-stack
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  values:
    grafana:
      route:
        main:
          enabled: true
          hostnames:
            - grafana.${CLUSTER_DOMAIN}
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: external
              namespace: gateway-system
      plugins:
        - victoriametrics-metrics-datasource
        - victoriametrics-logs-datasource
      sidecar:
        dashboards:
          searchNamespace: ALL
      grafana.ini:
        server:
          root_url: https://grafana.${CLUSTER_DOMAIN}
        log:
          mode: console
        log.console:
          format: json
    vmsingle:
      spec: &json-logs
        extraArgs:
          loggerFormat: json
    vmalert:
      spec: *json-logs
    vmagent:
      spec: *json-logs
    vlsingle:
      enabled: true
      spec: *json-logs
    vlagent:
      enabled: true
      spec: *json-logs
