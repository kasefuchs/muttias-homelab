apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 1h
  releaseName: victoria-metrics-k8s-stack
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  values:
    grafana:
      enabled: false
      forceDeployDatasource: true
    vmsingle:
      spec: &json-logs
        extraArgs:
          loggerFormat: json
    vmalert:
      spec: *json-logs
    vmagent:
      spec: *json-logs
    vlsingle:
      enabled: true
      spec: *json-logs
    vlagent:
      enabled: true
      spec: *json-logs
