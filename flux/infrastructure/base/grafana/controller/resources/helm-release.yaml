apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  releaseName: grafana
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: grafana
  values:
    grafana.ini:
      server:
        root_url: https://grafana.${CLUSTER_DOMAIN}
      log:
        mode: console
      log.console:
        format: json
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
        searchNamespace: ALL
    plugins:
      - victoriametrics-metrics-datasource
      - victoriametrics-logs-datasource
    route:
      main:
        enabled: true
        hostnames:
          - grafana.${CLUSTER_DOMAIN}
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: external
            namespace: gateway-system
