apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  interval: 1h
  releaseName: coder
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: coder
  values:
    coder:
      securityContext:
        capabilities:
          drop:
            - ALL
      service:
        type: ClusterIP
      env:
        - name: CODER_ACCESS_URL
          value: https://coder.${CLUSTER_DOMAIN}
        - name: CODER_WILDCARD_ACCESS_URL
          value: "*.coder.${CLUSTER_DOMAIN}"
        - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
          value: "false"
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-app
              key: uri
      httproute:
        enable: true
        host: coder.${CLUSTER_DOMAIN}
        wildcardHost: "*.coder.${CLUSTER_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: external
            namespace: gateway-system
