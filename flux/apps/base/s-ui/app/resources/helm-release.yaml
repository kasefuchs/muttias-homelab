apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: s-ui
spec:
  interval: 1h
  releaseName: s-ui
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: s-ui
  values:
    route:
      main:
        enabled: true
        hostnames:
          - sui.${CLUSTER_DOMAIN}
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: external
            namespace: gateway-system
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: web
          - matches:
              - path:
                  type: PathPrefix
                  value: /sub/
            backendRefs:
              - identifier: main
                port: sub
    persistence:
      database:
        existingClaim: ${NAME}
