apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: conduwuit
spec:
  interval: 1h
  releaseName: conduwuit
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: conduwuit
  values:
    config:
      global:
        allow_federation: true
        allow_registration: true
        server_name: uwuity.${CLUSTER_DOMAIN}
        well_known:
          client: https://uwuity.${CLUSTER_DOMAIN}
          server: uwuity.${CLUSTER_DOMAIN}:443
    route:
      main:
        enabled: true
        hostnames:
          - uwuity.${CLUSTER_DOMAIN}
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: external
            namespace: gateway-system
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              # mitigate gateway timeouts when using sliding sync
              request: 60s
            backendRefs:
              - identifier: main
    persistence:
      data:
        existingClaim: ${NAME}
      # store media in the same pvc as data
      media:
        enabled: false
