apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: conduwuit
spec:
  name: Continuwuity
  logo:
    logoUrl: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/continuwuity.svg
  secret:
    name: conduwuit-oidc-credentials
  launchUrl: https://uwuity.${CLUSTER_DOMAIN}
  callbackUrls:
    - https://uwuity.${CLUSTER_DOMAIN}/_continuwuity/oidc/complete
  pkceEnabled: true
  allowedUserGroups:
    - name: conduwuit
