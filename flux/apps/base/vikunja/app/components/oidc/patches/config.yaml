apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  values:
    config:
      auth:
        local:
          enabled: false
        openid:
          enabled: true
          providers:
            pocketid:
              name: Pocket ID
              requireavailability: true
    controllers:
      main:
        containers:
          main:
            envFrom:
              # TODO: use json patch here!!!!
              - secretRef:
                  name: vikunja-garage-key
              - secretRef:
                  name: vikunja-oidc-credentials
