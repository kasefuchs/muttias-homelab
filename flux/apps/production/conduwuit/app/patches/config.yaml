apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: conduwuit
spec:
  values:
    config:
      global:
        new_user_displayname_suffix: "🦊✨"
        server_name: uwuity.floof.fans
        well_known:
          client: https://uwuity.floof.fans
          server: uwuity.floof.fans:443
        auto_join_rooms:
          - "#space:uwuity.floof.fans"
          - "#general:uwuity.floof.fans"
          - "#announcements:uwuity.floof.fans"
