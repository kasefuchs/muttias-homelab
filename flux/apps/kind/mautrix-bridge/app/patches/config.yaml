apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-bridge
spec:
  values:
    config:
      homeserver:
        domain: uwuity.kind.homelab.test
        address: https://uwuity.kind.homelab.test
      bridge:
        permissions:
          uwuity.kind.homelab.test: user
          "@kasefuchs:uwuity.kind.homelab.test": admin
        login_shared_secret_map:
          uwuity.kind.homelab.test: "as_token:$BRIDGE_DOUBLE_PUPPET_AS_TOKEN"
