apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: ${NAME}-garage-key
spec:
  clusterRef:
    name: garage
    namespace: garage-system
  secretTemplate:
    includeBucketName: true
  bucketPermissions:
    - read: true
      write: true
      bucketRef:
        name: ${NAME}-garage-bucket
